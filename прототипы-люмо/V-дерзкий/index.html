  --hand:'Caveat','Comic Sans MS',cursive;

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{font-family:var(--ui);font-size:16px;color:var(--ink);background:var(--paper);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* ───────── ГЕРОЙ ───────── */
.stage{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;isolation:isolate}
.stage.drag{cursor:grabbing}
.grain{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .08  0 0 0 0 .07  0 0 0 0 .16  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* текст «снаружи» (задний план, тёмные чернила) */
.type{position:absolute;inset:0;z-index:1;pointer-events:none;font-family:var(--disp);font-weight:900;text-transform:uppercase;letter-spacing:-.045em;line-height:1;white-space:nowrap;opacity:0;transition:opacity .5s}
.ready .type{opacity:1}
.bubble,.cta{opacity:0}
.ready .bubble,.ready .cta{opacity:1}
.type .ln{position:absolute;left:0;width:100%;display:flex;justify-content:center;align-items:center}
.type .ln span{display:block}
.lens .ln span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:opacity .38s,transform .5s cubic-bezier(.3,1.5,.5,1)}
.lens .ln .b{opacity:0;transform:translate(-50%,-10%) rotateX(70deg) scale(.96)}
.lens .alt .ln .a{opacity:0;transform:translate(-50%,-90%) rotateX(-70deg) scale(.96)}
.lens .alt .ln .b{opacity:1;transform:translate(-50%,-50%)}
.lens .ln{perspective:600px}
.rm .lens .ln span{transition:none}
.back{color:var(--ink)}

.halo{position:absolute;z-index:0;pointer-events:none;object-fit:contain;opacity:.55;will-change:transform}

/* Люмо */
.lumo{position:absolute;inset:0;z-index:3;perspective:1500px;pointer-events:none}
.bw{position:absolute;will-change:transform;transform-style:flat}
.bw>img.body{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
/* линза: слова «внутри» Люмо, вырезаны по его силуэту */
.lens{position:absolute;pointer-events:none;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-image:var(--mask);mask-image:var(--mask)}
.lens .type{position:absolute;inset:0;opacity:0;font-weight:800;color:#1c1160;
  text-shadow:calc(var(--ca,2px)*-1) 0 rgba(79,216,255,.95),var(--ca,2px) 0 rgba(200,107,255,.95);will-change:transform}
.ready .lens .type{opacity:.92}
.lens .shine{position:absolute;inset:0;background:radial-gradient(40% 30% at 38% 28%,rgba(255,255,255,.55),transparent 70%);mix-blend-mode:screen}

.face{position:absolute;inset:0;pointer-events:none;will-change:transform}
.eye{position:absolute;width:11.5%;height:auto;aspect-ratio:1;left:0;top:0;margin:-5.75% 0 0 -5.75%;transform-origin:50% 55%;
  transform:translate(var(--ex,0px),var(--ey,0px)) scale(var(--sx,1),var(--sy,1.22));
  clip-path:inset(var(--ct,0%) 0 var(--cb,0%) 0);
  transition:transform .3s cubic-bezier(.3,1.7,.5,1),clip-path .24s ease-out}
.blink .eye{--sy:.06;transition:transform .08s ease-out}
.eye.l{left:40.5%;top:47.5%}
.eye.r{left:60%;top:46%}
.cheek{position:absolute;width:12%;aspect-ratio:1.5;border-radius:50%;background:radial-gradient(closest-side,rgba(255,110,170,.55),rgba(255,110,170,0));opacity:.55;transition:opacity .3s}
.cheek.l{left:28.5%;top:57%}.cheek.r{left:62.5%;top:56%}
[data-e=happy] .cheek,[data-e=laugh] .cheek{opacity:1}
.mouth{position:absolute;left:40.5%;top:56.8%;width:20%;height:auto;overflow:visible;transform:translate(var(--mx2,0px),var(--my2,0px))}
.mouth path{stroke:#E8795A;stroke-width:11;stroke-linejoin:round;stroke-linecap:round}
/* выражения */
[data-e=happy] .eye{--cb:46%;--sy:1.1}
[data-e=laugh] .eye{--cb:46%;--sy:1.1}
[data-e=wow] .eye{--sx:1.2;--sy:1.55}
[data-e=think] .eye{--ct:34%;--sy:1.15}
[data-e=wink] .eye.r{--cb:46%;--sy:1.1}
[data-e=wink] .eye.l{--sx:1.1;--sy:1.32}

/* реплика */
.bubble{position:absolute;z-index:6;left:clamp(16px,2.4vw,40px);top:41%;width:clamp(230px,21vw,320px);pointer-events:none}
.bubble p{position:relative;display:block;background:#fff;border:3px solid var(--ink);border-radius:30px;padding:14px 20px 16px;font:700 clamp(26px,2.2vw,34px)/1.05 var(--hand);box-shadow:6px 6px 0 var(--ink);transform-origin:0 100%}
.bubble p{transform-origin:100% 100%}.bubble p.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(.82) rotate(-3deg);opacity:.2}to{transform:none;opacity:1}}
.bubble i{position:absolute;right:26px;bottom:-26px;width:26px;height:26px;background:#fff;border:3px solid var(--ink);border-radius:50%;box-shadow:4px 4px 0 var(--ink)}
.bubble i+i{right:6px;bottom:-44px;width:14px;height:14px;box-shadow:3px 3px 0 var(--ink)}
.bubble,.cta{transition:opacity .35s,transform .5s cubic-bezier(.3,1.4,.5,1)}
@media (min-width:701px){
  .stage.dl .bubble{left:auto;right:clamp(16px,2.4vw,40px)}
  .stage.dl .bubble i{right:auto;left:26px}
  .stage.dl .bubble i+i{right:auto;left:6px}
  .stage.dl .bubble p{transform-origin:0 100%}
  .stage.dl .cta,.stage.dr .cta{opacity:0;pointer-events:none}
  .stage.dl .badge,.stage.dr .badge{opacity:0}
}
.badge{transition:opacity .35s}

.cta{position:absolute;z-index:6;right:clamp(16px,2.4vw,40px);top:41%;width:clamp(240px,19.5vw,290px);display:flex;flex-direction:column;gap:14px;align-items:stretch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:14px 22px;border:3px solid var(--ink);border-radius:999px;font:800 17px/1.1 var(--disp);letter-spacing:-.02em;text-decoration:none;text-align:center;
  background:var(--coral);color:var(--ink);box-shadow:6px 6px 0 var(--ink);transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s}
.btn:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:var(--paper);font-weight:700;font-family:var(--ui);font-size:17px;letter-spacing:0}
.btn:focus-visible,.lang button:focus-visible{outline:4px solid var(--cyan);outline-offset:3px}
.cta .btn{pointer-events:auto}

.bar{position:absolute;z-index:8;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,2.4vw,40px);gap:12px}
.logo{display:flex;align-items:center;gap:10px;font:900 18px/1 var(--disp);letter-spacing:-.04em;text-decoration:none}
.logo b{width:26px;height:26px;border-radius:50% 50% 46% 46%/56% 56% 44% 44%;background:var(--lumo-grad);box-shadow:inset -3px -4px 6px rgba(120,40,200,.35),inset 3px 3px 6px rgba(255,255,255,.7)}
.lang{position:relative;display:flex;gap:6px;align-items:center}
.lang ul{display:flex;gap:6px;list-style:none}
.lang button{min-width:46px;min-height:44px;padding:0 10px;border-radius:999px;border:2.5px solid var(--ink);font:700 16px/1 var(--ui);background:var(--paper);transition:background .2s,color .2s,transform .2s}
.lang button:hover{transform:translateY(-2px)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.lang .cur{display:none}
.stub{position:absolute;z-index:8;top:74px;right:clamp(16px,2.4vw,40px);max-width:300px;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--paper);font:500 16px/1.3 var(--ui);opacity:0;transform:translateY(-6px);transition:.3s;pointer-events:none}
.stub.on{opacity:1;transform:none}

.hint{position:absolute;z-index:6;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--paper);font:700 16px/1 var(--ui);white-space:nowrap;transition:opacity .5s,transform .5s;pointer-events:none}
.hint svg{width:34px;height:14px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(7px)}}
.hint.gone{opacity:0;transform:translate(-50%,14px)}

.badge{position:absolute;z-index:6;right:clamp(16px,2.4vw,40px);top:57.5%;width:88px;height:88px;pointer-events:none}
.badge svg{width:100%;height:100%;animation:spin 22s linear infinite}
.badge text{font:800 12.5px var(--disp);fill:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───────── БЛОК ВНИЗУ: «ВСЕРЕДИНІ ЛЮМО» ───────── */
.inside{position:relative;height:420vh;background:var(--paper)}
.pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;isolation:isolate}
.sil{position:absolute;left:50%;top:50%;width:var(--S,600px);height:var(--S,600px);margin:calc(var(--S,600px)/-2) 0 0 calc(var(--S,600px)/-2);background:radial-gradient(30% 22% at 34% 26%,rgba(255,255,255,.7),rgba(255,255,255,0) 70%),linear-gradient(160deg,#4FD8FF 0%,#9fb4ff 48%,#C86BFF 100%);
  -webkit-mask:var(--mask-solid) center/contain no-repeat;mask:var(--mask-solid) center/contain no-repeat;will-change:transform}
.fill{position:absolute;inset:0;background:linear-gradient(160deg,#4FD8FF 0%,#9fb4ff 48%,#C86BFF 100%);opacity:0;will-change:opacity}
.words{position:absolute;inset:0;pointer-events:none}
.w{position:absolute;font:900 clamp(34px,6.4vw,104px)/1 var(--disp);letter-spacing:-.05em;white-space:nowrap;color:rgba(20,17,43,.15);will-change:transform;opacity:0}
.w.solid{color:rgba(255,255,255,.8)}
.sw{position:absolute;inset:0;display:grid;place-items:center;padding:0 clamp(18px,6vw,120px);text-align:center;opacity:0;will-change:transform,opacity}
.sw h2{font:900 clamp(30px,6.2vw,96px)/1.02 var(--disp);letter-spacing:-.05em;text-wrap:balance}
.sw h2 em{font-style:normal;display:inline-block;background:var(--ink);color:var(--paper);padding:.04em .22em .1em;border-radius:.22em;transform:rotate(-2deg)}
.sw p{margin-top:22px;font:700 clamp(26px,2.6vw,40px)/1 var(--hand)}
.tag{position:absolute;z-index:3;top:22px;left:50%;transform:translateX(-50%);font:700 16px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:10px 18px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.peek{position:absolute;left:50%;bottom:0;display:flex;gap:min(4vw,36px);transform:translate(-50%,110%);will-change:transform;z-index:2}
.peek img{width:min(22vw,170px);height:auto;transform:translate(var(--ex,0px),var(--ey,0px))}
.fin{position:absolute;z-index:4;left:0;right:0;bottom:11vh;display:flex;justify-content:center;opacity:0;pointer-events:none}
.fin.on{pointer-events:auto}

/* ───────── ТЕЛЕФОН ───────── */
@media (max-width:700px){
  .bar{padding:12px 14px}
  .logo{font-size:16px}
  .lang .cur{display:inline-flex;align-items:center;gap:8px}
  .lang ul{position:absolute;right:0;top:52px;flex-wrap:wrap;width:196px;padding:10px;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);opacity:0;pointer-events:none;transform:translateY(-8px);transition:.2s}
  .lang.open ul{opacity:1;pointer-events:auto;transform:none}
  .stub{top:68px;right:14px;left:14px;max-width:none}
  .bubble{left:18px;right:22px;width:auto;top:auto;bottom:calc(98px + env(safe-area-inset-bottom,0px))}
  .bubble p{font-size:26px;padding:12px 18px 14px;border-radius:26px 26px 26px 6px}
  .bubble i{display:none}
  .cta{left:18px;right:22px;width:auto;top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));flex-direction:row}
  .cta .btn{flex:1;padding:12px 14px;font-size:16px;min-height:56px}
  .cta .btn.ghost{display:none}
  .badge{display:none}
  .hint{bottom:auto;top:66px;font-size:16px;padding:9px 16px}
  .btn{box-shadow:5px 5px 0 var(--ink)}
}
@media (max-width:1100px) and (min-width:701px){
  .bubble,.cta{width:210px}
  .badge{display:none}
}

/* ───────── Меньше движения / слабый телефон ───────── */
.lite .halo{display:none}
.lite .grain{display:none}
.lite .w.x{display:none}
.rm .hint,.rm .badge svg{animation:none}
.rm .hint{display:none}
.rm .lens .type{text-shadow:none}
.rm .bubble p{transform-origin:100% 100%}.bubble p.pop{animation:none}
.rm .eye,.rm .stub{transition:none}
.rm .inside{height:auto}
.rm .pin{position:relative;height:auto;display:flex;flex-direction:column;justify-content:center;gap:7vh;padding:10vh 0 11vh}
.rm .sil{display:none}
.rm .fill{opacity:1}
.rm .words,.rm .peek{display:none}
.rm .sw{position:relative;opacity:1;inset:auto;padding:0 clamp(18px,6vw,120px)}
.rm .tag{position:relative;top:auto;left:auto;transform:none;align-self:center}
.rm .fin{position:relative;opacity:1;bottom:auto;pointer-events:auto}
.rm .sw{padding-top:0;padding-bottom:0}
.rm .sw h2{line-height:1.12}
@media (prefers-reduced-motion:reduce){
  .badge svg,.hint svg{animation:none}
}
</style>

<script>

/* ───── Тексти (uk/pl/en — переклад; de/cs/ru — заглушка UI) ───── */

  pl:{h:['Mów','z Lumo'],alt:['Speak','with Lumo'],
    say:{hi:'Cześć! Jestem Lumo. Pociągnij mnie — a słowa przemówią po angielsku.',tickle:'Hihi! Łaskocze.',drag:'Patrz, tłumaczę!',drop:'Ojej! Jeszcze raz?',idle:'Nigdzie się nie spieszę. Ty też nie.',cta:'Spróbujemy pierwszej lekcji razem?',lang:'Zmieniłem język. Nadal jestem sobą.',scroll:'Przewiń — pokażę, co w środku.',pulse:'A po angielsku — tak.',hiTap:'Dotknij mnie — a słowa przemówią po angielsku.'},

    h1:'Speak with Lumo',stub:'This language is a UI stub — showing English.'}
};
const FALL = {de:'en',cs:'pl',ru:'uk'};
let lang = 'uk';

/* ───── Рот: морфинг кубических кривых ───── */
const M = { // L, R, T1,T2 (верх), B1,B2 (низ), fill
  smile:{p:[22,30, 178,30, 62,80, 138,80, 138,80, 62,80],f:0,t:0},
  soft: {p:[44,36, 156,36, 76,66, 124,66, 124,66, 76,66],f:0,t:0},
  grin: {p:[10,24, 190,24, 60,44, 140,44, 160,112, 40,112],f:1,t:.9},
  wow:  {p:[72,52, 128,52, 62,2, 138,2, 138,104, 62,104],f:1,t:.55},
  think:{p:[50,52, 150,44, 84,40, 116,64, 116,64, 84,40],f:0,t:0}
};
const mline=$('#mline'), mfill=$('#mfill'), mclip=$('#mclipP'), tongue=$('#tongue');
let mCur = JSON.parse(JSON.stringify(M.smile)), mFrom = mCur, mTo = M.smile, mT0 = 0, mDone = true;
function drawMouth(m){
  const p=m.p, d=`M${p[0]} ${p[1]}C${p[4]} ${p[5]} ${p[6]} ${p[7]} ${p[2]} ${p[3]}C${p[8]} ${p[9]} ${p[10]} ${p[11]} ${p[0]} ${p[1]}Z`;
  mline.setAttribute('d',d); mfill.setAttribute('d',d); mclip.setAttribute('d',d);
  mfill.setAttribute('fill-opacity',m.f.toFixed(2)); tongue.setAttribute('opacity',m.t.toFixed(2));
}
function setMouth(name){
  mFrom = JSON.parse(JSON.stringify(mCur)); mTo = M[name]; mT0 = performance.now(); mDone = false;
  if (RM) { mCur = JSON.parse(JSON.stringify(mTo)); drawMouth(mCur); }
}
function stepMouth(now){
  if (!mTo || mDone) return;
  let k = Math.min(1,(now-mT0)/320); const e = 1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2); // easeOutBack
  mCur = { p: mFrom.p.map((v,i)=>v+(mTo.p[i]-v)*e), f: mFrom.f+(mTo.f-mFrom.f)*k, t: mFrom.t+(mTo.t-mFrom.t)*k };
  drawMouth(mCur); if (k>=1) mDone = true;
}
drawMouth(M.smile);

/* ───── Мімика ───── */
const face = $('#face');
let exprTimer = 0, curExpr = 'neutral', altTimer = 0;
function showAlt(ms){ clearTimeout(altTimer); $('#typeLens').classList.add('alt'); if (ms) altTimer = setTimeout(()=>$('#typeLens').classList.remove('alt'), ms); }
function hideAlt(){ clearTimeout(altTimer); $('#typeLens').classList.remove('alt'); }
const EX = { neutral:'smile', happy:'smile', laugh:'grin', wow:'wow', think:'think', wink:'soft' };
function expr(name, ms){
  clearTimeout(exprTimer); curExpr = name;
  face.dataset.e = name; setMouth(EX[name]);
  if (ms && !RM) exprTimer = setTimeout(()=>expr('neutral'), ms);
}

/* ───── Реплики ───── */
const say = $('#say'); let sayKey = 'hi', sayLock = 0;
function speak(key, hold=0){
  const now = performance.now(); if (now < sayLock && key!==sayKey && hold<=0) return;
  if (RM && key==='hi') key = 'hiTap';
  const txt = T[lang==='uk'||lang==='pl'||lang==='en'?lang:FALL[lang]].say[key]; if(!txt) return;
  sayKey = key; sayLock = now + (hold||1800);
  say.textContent = txt; say.classList.remove('pop'); void say.offsetWidth; say.classList.add('pop');
}

/* ───── Мова ───── */
function applyLang(l, silent){
  lang = l; const L = FALL[l] || l, D = T[L];
  document.documentElement.lang = l;
  $$('#langList button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===l));
  $('#langCur').firstChild.textContent = (l==='uk'?'UA':l.toUpperCase())+' ';
  $$('[data-t]').forEach(el=>{ el.innerHTML = D[el.dataset.t]; });
  const back = $$('#typeBack .ln span');
  back.forEach((s,i)=>s.textContent = D.h[i]); $$('#typeLens .ln .a').forEach((s,i)=>s.textContent = D.h[i]); $$('#typeLens .ln .b').forEach((s,i)=>s.textContent = D.alt[i]);
  $('#h1').textContent = D.h1;
  const stub = $('#stub');
  if (FALL[l]) { stub.textContent = D.stub; stub.classList.add('on'); clearTimeout(stub._t); stub._t=setTimeout(()=>stub.classList.remove('on'),3800); } else stub.classList.remove('on');
  fit(); if (!silent){ speak('lang',2500); expr('wink',900); }
}
$$('#langList button').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); applyLang(b.dataset.l); $('#lang').classList.remove('open'); $('#langCur').setAttribute('aria-expanded','false'); }));
$('#langCur').addEventListener('click',e=>{ e.stopPropagation(); const o=$('#lang').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded',o); });
['pointerdown'].forEach(ev=>$('#lang').addEventListener(ev,e=>e.stopPropagation()));

/* ───── Розкладка ───── */
const stage=$('#stage'), bw=$('#bw'), lens=$('#lens'), typeLens=$('#typeLens'), typeBack=$('#typeBack'), halo=$('#halo');
let sw=0, sh=0, B=0, BH=0, bl=0, bt=0, cx=0, cy=0, phone=false, lensK=.9;
function fit(){
  sw = stage.clientWidth; sh = stage.clientHeight; phone = sw < 700;
  B  = phone ? Math.min(sw*1.5, sh*.8) : Math.min(sh*.92, sw*.86);
  BH = B*909/900;
  cx = sw/2 + (phone ? 0 : 0); cy = sh*(phone ? .5 : .535);
  bl = cx - B/2; bt = cy - BH*.54; if (phone) bt = sh*.5 - BH*.5;
  Object.assign(bw.style,{left:bl+'px',top:bt+'px',width:B+'px',height:BH+'px'});
  {const k=336/256, pw=B*k, ph=BH*k; Object.assign(halo.style,{left:(bl-(pw-B)/2)+'px',top:(bt-(ph-BH)/2)+'px',width:pw+'px',height:ph+'px'});}
  Object.assign(lens.style,{left:-bl+'px',top:-bt+'px',width:sw+'px',height:sh+'px',
    webkitMaskSize:`${B}px ${BH}px`, maskSize:`${B}px ${BH}px`,
    webkitMaskPosition:`${bl}px ${bt}px`, maskPosition:`${bl}px ${bt}px`});
  typeLens.style.transformOrigin = `${cx}px ${cy}px`;
  // шрифт: каждая строка по ширине экрана; строки «изнутри» — того же размера, но не шире
  const target = sw*(phone?.94:.93), maxH = sh*(phone?.2:.3);
  const bs = $$('#typeBack .ln span'), ls = $$('#typeLens .ln .a'), lb = $$('#typeLens .ln .b');
  const y = phone ? [.255,.69] : [.235,.795];
  bs.forEach((s,i)=>{
    s.parentNode.style.fontSize='100px'; s.style.fontSize='100px';
    const w = s.getBoundingClientRect().width || 600;
    const fs = Math.min(100*target/w, maxH*1.35, 340);
    [bs[i], ls[i]].forEach(el=>{ el.style.fontSize=fs+'px'; });
    // lens: уместить в target
    lb[i].style.fontSize = fs+'px';
    const lw = lb[i].getBoundingClientRect().width;
    if (lw > target) lb[i].style.fontSize = fs*target/lw+'px';
    [bs[i].parentNode, ls[i].parentNode].forEach(ln=>{ ln.style.height = fs*.9+'px'; ln.style.top = (sh*y[i] - fs*.45)+'px'; });
  });
  document.documentElement.style.setProperty('--S', Math.min(sw*(phone?.8:.4), sh*.52)+'px');
}

/* ───── Рух ───── */
const S = { x:0,y:0,vx:0,vy:0, tx:0,ty:0, mx:0,my:0, smx:0,smy:0, gx:0,gy:0, gyro:false };
let lastPulse = performance.now(), drag = null, lastInput = performance.now(), poked = 0, tickleAt = 0, p = 0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eyes = $$('.eye'), mouthEl=$('#mouth');

function onMove(e){
  lastInput = performance.now();
  const r = stage.getBoundingClientRect();
  S.mx = clamp((e.clientX - r.left - sw/2)/(sw/2), -1, 1);
  S.my = clamp((e.clientY - r.top  - sh/2)/(sh/2), -1, 1);
  if (drag){
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx,dy) > 7){ drag.moved = true; stage.classList.add('drag'); expr('laugh'); showAlt(); speak('drag',1400); $('#hint').classList.add('gone'); }
    if (drag.moved){ S.tx = clamp(dx, -sw*.42, sw*.42); S.ty = clamp(dy*.7, -sh*.2, sh*.2); }
  } else if (!RM) {
    // лёгкая щекотка, когда курсор у лица
    const fx = bl + B*.5, fy = bt + BH*.56, d = Math.hypot(e.clientX-r.left-fx, e.clientY-r.top-fy)/B;

    if (d < .16 && now - tickleAt > 5000 && e.pointerType==='mouse'){ tickleAt = now; expr('laugh',1100); showAlt(1600); speak('tickle',1500); S.vy -= 7; }
    else if (d > .5 && curExpr==='neutral' && Math.random()<.002) expr('wow',700);
  }
}
stage.addEventListener('pointermove', onMove, {passive:true});
stage.addEventListener('pointerdown', e=>{
  if (e.target.closest('a,button,.lang')) return;
  lastInput = performance.now(); drag = {x0:e.clientX,y0:e.clientY,moved:false};

});
function endDrag(e){
  if (!drag) return; const moved = drag.moved; drag = null; stage.classList.remove('drag');
  S.tx = 0; S.ty = 0;
  if (moved){ expr('wow',700); showAlt(2400); speak('drop',2200); S.vx *= 1.1; }
  else if (e && e.type==='pointerup'){ // тап — тычок
    S.vy -= 12; S.vx += (Math.random()-.5)*8; expr(Math.random()<.5?'wink':'laugh',1000); showAlt(1800); speak('tickle',1500);
  }
}
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);

// гироскоп (iOS просит жест; микрофон не трогаем)
let gyroAsked=false;
function askGyro(){
  if (gyroAsked || RM) return; gyroAsked = true;
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function'){ D.requestPermission().then(r=>{ if(r==='granted') listenGyro(); }).catch(()=>{}); }
  else if (D && 'ontouchstart' in window) listenGyro();
}
function listenGyro(){
  window.addEventListener('deviceorientation', ev=>{
    if (ev.gamma==null) return; S.gyro = true;
    S.mx = clamp(ev.gamma/22,-1,1); S.my = clamp(((ev.beta||0)-50)/26,-1,1); lastInput = performance.now();
  }, {passive:true});
}
if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function' && 'ontouchstart' in window && !RM) listenGyro();

// простой: думает / оглядывается / говорит
setInterval(()=>{
  if (RM || drag) return;
  if (performance.now()-lastPulse > 11000 && curExpr==='neutral'){ lastPulse = performance.now(); showAlt(2600); speak('pulse',2800); expr('wink',900); } const idle = performance.now()-lastInput;
  if (idle > 7000 && curExpr==='neutral'){ expr('think',2600); speak('idle',3000); }
}, 1500);

// моргание
(function blinkLoop(){
  if (RM) return;
  const go = ()=>{
    face.classList.add('blink'); setTimeout(()=>face.classList.remove('blink'),130);
    if (Math.random()<.22) setTimeout(()=>{face.classList.add('blink'); setTimeout(()=>face.classList.remove('blink'),120);},260);
    setTimeout(go, 3200+Math.random()*2600);
  }; setTimeout(go, 1800);
})();

/* ───── Секция «внутри» ───── */
const inside=$('#inside'), sil=$('#sil'), fillEl=$('#fill'), words=$$('.w'), sws=$$('.sw'), peek=$('#peek'), fin=$('#fin');
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const bump = (q,a,b) => clamp((q-a)/(b-a),0,1);
function scene(){
  if (RM) return;
  const r = inside.getBoundingClientRect(), total = inside.offsetHeight - sh;
  const qv = clamp(-r.top/total, 0, 1);
  if (r.top > sh || r.bottom < 0) return;
  const end = Math.hypot(sw,sh)/ (parseFloat(getComputedStyle(root).getPropertyValue('--S'))||600) * 3.6;
  const g = ease(bump(qv,.0,.38));
  sil.style.transform = `scale(${1+(end-1)*g}) rotate(${(-8*(1-g)).toFixed(2)}deg)`;
  fillEl.style.opacity = bump(qv,.1,.24);
  words.forEach(w=>{
    const d = +w.dataset.d, y = (1-qv*2.15)*d*sh*.62;
    w.style.transform = `translate3d(0,${y.toFixed(1)}px,0)`; w.style.opacity = bump(qv,.16,.3)*(1-bump(qv,.9,1));
  });
  const win = [[.19,.4],[.4,.6],[.6,.8],[.8,1.01]];
  sws.forEach((s,i)=>{
    const [a,b] = win[i], m = (a+b)/2, last = i===3;
    const fin_ = bump(qv,a,a+.06), fout = last ? 0 : bump(qv,b-.06,b);
    s.style.opacity = fin_*(1-fout);
    s.style.transform = `translate3d(0,${((m-qv)*sh*.55).toFixed(1)}px,0) scale(${(.94+.06*fin_ - .04*fout).toFixed(3)})`;
  });
  const pk = bump(qv,.76,.92); peek.style.transform = `translate(-50%,${110-pk*58}%)`;
  fin.style.opacity = bump(qv,.86,.96); fin.classList.toggle('on', qv>.9);
  if (qv>.9 && curExpr==='neutral') {}
}

/* ───── Главный цикл ───── */
let last = performance.now(), frame = 0, curDir = '', lastSig = '';
const peekEyes = $$('.peek img');
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(2.5,(now-last)/16.67); last = now; frame++;
  if (LITE && (frame&1)) return;
  const dragging = !!(drag && drag.moved);
  // пружина
  const k = dragging ? .2 : .06, damp = dragging ? .62 : .87;
  S.vx += (S.tx - S.x)*k*dt; S.vy += (S.ty - S.y)*k*dt; S.vx *= Math.pow(damp,dt); S.vy *= Math.pow(damp,dt);
  S.x += S.vx*dt; S.y += S.vy*dt;
  S.smx += (S.mx - S.smx)*.08*dt; S.smy += (S.my - S.smy)*.08*dt;
  const mx = RM?0:S.smx, my = RM?0:S.smy;
  p = clamp(scrollY/sh, 0, 1.2);
  const t = now/1000, fl = (RM||LITE)?0:Math.sin(t*1.25)*B*.007, br = (RM||LITE)?1:1+Math.sin(t*1.6)*.005;
  const speed = Math.hypot(S.vx,S.vy), sx = 1 + clamp(Math.abs(S.vx)*.0035 - Math.abs(S.vy)*.002, -.05, .09), sy = 1/sx;
  const px = S.x + mx*sw*.012, py = S.y + my*sh*.01 + fl + p*sh*.22, rot = clamp(S.vx*.16 + mx*1.4, -7, 7), sc = br*(1-p*.05);
  const sig=[px,py,rot,sx,mx,my,p,dragging,S.vx,S.vy].map(v=>typeof v==='number'?v.toFixed(2):v).join(), changed = sig!==lastSig; lastSig = sig;
  if (changed){
  if (!LITE) bw.style.transform = `translate3d(${px.toFixed(2)}px,${py.toFixed(2)}px,0) rotateY(${(mx*7).toFixed(2)}deg) rotateX(${(-my*5).toFixed(2)}deg) rotate(${rot.toFixed(2)}deg) scale(${(sc*sx).toFixed(4)},${(sc*sy).toFixed(4)})`;
  else bw.style.transform = `translate3d(${px.toFixed(1)}px,${py.toFixed(1)}px,0) rotate(${rot.toFixed(2)}deg)`;
  // фон — другая глубина
  const bx = -mx*sw*.007, by = -my*sh*.007 - p*sh*.07;
  typeBack.style.transform = `translate3d(${bx.toFixed(2)}px,${by.toFixed(2)}px,0)`;
  // линза: слова внутри — между телом и фоном по глубине
  const ix = bx - px*lensK, iy = by - py*lensK;
  typeLens.style.transform = `translate3d(${ix.toFixed(2)}px,${iy.toFixed(2)}px,0) rotate(${(-rot*.9).toFixed(2)}deg) scale(${(1+Math.min(.05,speed*.004)).toFixed(3)})`;
  typeLens.style.setProperty('--ca', (2 + clamp(Math.abs(S.vx)*.45 + Math.abs(S.vy)*.3,0,9)).toFixed(2)+'px');
  // ореол запаздывает — ещё глубже
  if (!LITE) halo.style.transform = `translate3d(${(px*.9).toFixed(1)}px,${(py*.9 + B*.03).toFixed(1)}px,0) scale(1.02)`;
  // лицо плывёт внутри стекла; глаза и рот — на разной глубине
  const fx = mx*B*.026 + S.vx*.35, fy = my*B*.02 + S.vy*.2;
  face.style.transform = `translate3d(${fx.toFixed(2)}px,${fy.toFixed(2)}px,0)`;
  let lx = mx, ly = my;
  if (dragging){ lx = clamp(S.vx*.12,-1,1); ly = clamp(S.vy*.12,-1,1); }
  const ex = (lx*B*.012).toFixed(2)+'px', ey = (ly*B*.01).toFixed(2)+'px';
  face.style.setProperty('--ex',ex); face.style.setProperty('--ey',ey);
  mouthEl.style.setProperty('--mx2',(mx*B*.006).toFixed(2)+'px'); mouthEl.style.setProperty('--my2',(my*B*.005).toFixed(2)+'px');
  peekEyes.forEach(i=>{ i.style.setProperty('--ex',(S.smx*14).toFixed(1)+'px'); i.style.setProperty('--ey',(S.smy*10).toFixed(1)+'px'); });
  }
  const dir = S.x < -sw*.1 ? 'dl' : S.x > sw*.1 ? 'dr' : '';
  if (dir !== curDir){ stage.classList.remove('dl','dr'); if (dir) stage.classList.add(dir); curDir = dir; }
  stepMouth(now); scene();
}

/* ───── Старт ───── */
function start(){
  fit(); applyLang('uk',true); speak('hi',100);
  if (!RM) requestAnimationFrame(tick);
  else { // статичный красивый вариант
    bw.style.transform='none'; typeLens.style.transform='none'; face.style.setProperty('--ex','0px');
    const pkv=$('#peek'); if(pkv) pkv.style.display='none';
  }
}
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(fit,80); });
let fontsDone = false;
const finish = ()=>{ if (fontsDone) return; fontsDone = true; fit(); root.classList.add('ready'); };
const FL = ()=>Promise.all(['900 100px Unbounded','800 100px Unbounded','700 20px Caveat','700 16px Onest'].map(f=>document.fonts.load(f))).catch(()=>{});
const lk = document.querySelector('link[href*="googleapis"]');
const go = ()=>FL().then(finish);
if (lk && lk.media === 'print') lk.addEventListener('load',()=>setTimeout(go,0)); else go();
setTimeout(finish,1000);
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',()=>{ if (fontsDone) fit(); });
start();
setTimeout(()=>{ if (!RM) speak('cta',2600); }, 9000);
$('#inside').addEventListener('pointerenter',()=>{},{once:true});
let seenScroll=false; addEventListener('scroll',()=>{ if(!seenScroll && scrollY>20){ seenScroll=true; speak('scroll',2500); expr('wow',800); } },{passive:true});
$$('a.btn').forEach(a=>a.addEventListener('pointerenter',()=>{ expr('happy',1400); speak('cta',1800); }));
$$('a[href="#start"]').forEach(a=>a.addEventListener('click',e=>e.preventDefault())); // заглушка: запис ще не підключено
window.__lumo = {expr, speak, fit, S, setLang:applyLang};
})();
</script>
