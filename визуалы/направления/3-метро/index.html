<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>LUMOSCHOOL · 3 Метро</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F4F1EA}
body{width:1512px;font-family:'Onest',sans-serif;color:#12151C}
.hero{position:relative;width:1512px;height:830px;overflow:hidden;background:#F4F1EA;background-image:linear-gradient(rgba(18,21,28,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(18,21,28,.055) 1px,transparent 1px);background-size:40px 40px}
svg{position:absolute;left:0;top:0}
.bar{position:absolute;left:56px;right:56px;top:30px;display:flex;align-items:center;justify-content:space-between;z-index:3;font-size:15px}
.logo{font:800 20px 'Onest';letter-spacing:.04em}
nav{display:flex;gap:30px;color:#4A5160;font-weight:500}
.pills{display:flex;gap:6px}
.pills span{font:700 12px 'JetBrains Mono';border:2px solid #12151C;border-radius:99px;padding:6px 10px;letter-spacing:.06em}
.pills .on{background:#12151C;color:#fff}
.tag{position:absolute;left:56px;top:104px;font:700 14px 'JetBrains Mono';letter-spacing:.16em;color:#E8352B;z-index:3}
h1{position:absolute;left:56px;top:136px;font:800 76px/1.02 'Onest';letter-spacing:-.04em;z-index:3}
.sub{position:absolute;left:56px;top:372px;font:500 20px/1.4 'Onest';color:#4A5160;max-width:520px;z-index:3}
.stamp{position:absolute;right:56px;bottom:26px;font:500 13px 'JetBrains Mono';letter-spacing:.1em;color:#4A5160;z-index:3}
</style></head><body>
<section class="hero">
<svg id="m" width="1512" height="830" viewBox="0 0 1512 830"></svg>
<div class="bar"><div class="logo">LUMOSCHOOL</div><nav><span>Уроки</span><span>Для дітей</span><span>Для дорослих</span><span>Ціни</span></nav><div class="pills"><span class="on">UA</span><span>PL</span><span>EN</span><span>DE</span><span>CS</span><span>RU</span></div></div>
<div class="tag">ОДИН КЛАС · ШІСТЬ МІСТ</div>
<h1>Де б ти не був —<br>ти в одному<br>класі.</h1>
<div class="sub">Живі уроки англійської для українців за кордоном і вдома. Один розклад, час — за місцевим.</div>
<div class="stamp">СХЕМА · ЧАС ПОКАЗАНО МІСЦЕВИЙ ДЛЯ КОЖНОГО МІСТА</div>
</section>
<section id="strip"></section>
<script src="../shared/weather.js"></script>
<script>
const C=['#E8352B','#FF8A1F','#F5B800','#17A862','#1F6BFF','#8B3DFF'];
const TC=['#C42A21','#C25A00','#9A7000','#0E7A45','#1F6BFF','#6A2BD9'];
const cities=[['Київ','19:00'],['Варшава','18:00'],['Берлін','18:00'],['Прага','18:00'],['Лондон','17:00'],['Торонто','12:00']];
const T=[230,318,406,494,582,670], Y0=470, GAP=20, XB=[700,728,756,784,728,700], XE=1190;
let d='',st='',lb='';
for(let i=0;i<6;i++){
 const y=Y0+i*GAP, dd=Math.abs(T[i]-y), dir=T[i]<y?-1:1, xb=XB[i];
 const p=`M110 ${y} H${xb} L${xb+dd} ${T[i]} H${XE}`;
 d+=`<path d="${p}" stroke="#F4F1EA" stroke-width="22" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
 d+=`<path d="${p}" stroke="${C[i]}" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
 st+=`<circle cx="${XE}" cy="${T[i]}" r="17" fill="#fff" stroke="${C[i]}" stroke-width="8"/>`;
 lb+=`<text x="${XE+36}" y="${T[i]+4}" font-family="Onest" font-weight="800" font-size="40" fill="#12151C" letter-spacing="-1">${cities[i][0]}</text><text x="${XE+36}" y="${T[i]+34}" font-family="JetBrains Mono" font-weight="700" font-size="22" fill="${TC[i]}" letter-spacing="1">${cities[i][1]}</text>`;
}
for(let i=0;i<6;i++){const x=1010+(i%2)*46,y=T[i];st+=`<rect x="${x}" y="${y-13}" width="76" height="26" rx="13" fill="${C[i]}" stroke="#F4F1EA" stroke-width="4"/>`+[0,1,2].map(k=>`<rect x="${x+12+k*20}" y="${y-5}" width="12" height="9" rx="2" fill="#fff"/>`).join('');}
const lv=['A1','A2','B1','B2','C1','C2'];
[150,235,320,405,490,575].forEach((x,i)=>{
 st+=`<rect x="${x-11}" y="${Y0-14}" width="22" height="${5*GAP+28}" rx="11" fill="#fff" stroke="#12151C" stroke-width="5"/>`;
 lb+=`<text x="${x}" y="${Y0+5*GAP+54}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="17" fill="#12151C">${lv[i]}</text>`;
});
st+=`<circle cx="92" cy="${Y0+50}" r="42" fill="#12151C"/><text x="92" y="${Y0+55}" text-anchor="middle" font-family="Onest" font-weight="800" font-size="17" fill="#fff" letter-spacing=".5">LUMO</text>`;
lb+=`<text x="150" y="${Y0+5*GAP+84}" font-family="JetBrains Mono" font-weight="500" font-size="15" fill="#4A5160" letter-spacing="2">РІВНІ A1 → C2 · КОЖНА СТАНЦІЯ — КРОК ВПЕРЕД</text>`;
const ghost=`<text x="1180" y="600" text-anchor="end" font-family="Onest" font-weight="800" font-size="400" fill="none" stroke="#12151C" stroke-opacity=".05" stroke-width="2" letter-spacing="-14">LUMO</text>`;
document.getElementById('m').innerHTML=ghost+d+st+lb;
weatherStrip(document.getElementById('strip'),{bg:'#F4F1EA',card:'#fff',fg:'#12151C',accent:'#E8352B',accent2:'#1F6BFF',font:'Onest',btnfg:'#fff',sig:k=>{const col=k==='kids'?'#E8352B':k==='teens'?'#1F6BFF':'#17A862';return `<div style="position:absolute;left:0;top:0;bottom:0;width:10px;background:${col}"></div><div style="position:absolute;left:-2px;top:26px;width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid #12151C"></div>`}});
</script></body></html>
